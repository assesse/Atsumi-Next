<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atsumi adaptive GalleryCard review</title>
  <style>
    /* CN flag is the hand-authored public-domain geometry in ../src/assets/flags/cn.svg. */
    :root { color-scheme: light; font-family: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif; color: #16242b; background: #f3f6f5; }
    body { margin: 0; padding: 24px; }
    header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1, p { margin: 0; }
    h1 { font-size: 20px; }
    p { color: #64767d; font-size: 13px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    label { color: #52676e; font-size: 13px; font-weight: 600; }
    select, button { min-height: 34px; padding: 5px 10px; font: inherit; color: #42585f; background: #fff; border: 1px solid #cfdddb; border-radius: 8px; }
    button[aria-pressed="true"] { color: #0879aa; background: #e8f6f9; border-color: #73bed5; }
    .gallery-grid { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); align-items: start; gap: 14px; }
    .gallery-card { display: grid; grid-template-columns: minmax(112px, var(--preview)) minmax(0, 1fr); align-self: start; block-size: var(--preview); min-width: 0; min-height: 0; overflow: hidden; background: #fff; border: 0; border-radius: 10px; box-shadow: inset 0 0 0 1px #d5e1df, 0 1px 2px rgb(19 47 54 / 4%); }
    .cover { position: relative; height: 100%; min-height: 0; background: linear-gradient(135deg, #a9c7c8, #e7eeed 44%, #6c9da3); }
    .cover::after { position: absolute; inset: 16% 14%; content: ""; border: 1px solid rgb(255 255 255 / 60%); transform: rotate(-8deg); }
    .language-flag { position: absolute; z-index: 2; right: 8px; bottom: 8px; display: grid; place-items: center; width: 30px; height: 22px; padding: 3px; background: rgb(255 255 255 / 90%); border-radius: 6px; }
    .language-flag img { width: 100%; height: 100%; object-fit: contain; }
    .status-pill { position: absolute; z-index: 3; top: 8px; left: 8px; padding: 4px 7px; color: #fff; font-size: 11px; font-weight: 700; background: #d96f21; border: 0; border-radius: 999px; }
    .status-pill.duplicate { background: #b04478; }
    .card-content { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; block-size: 100%; min-width: 0; min-height: 0; padding: 12px; overflow: hidden; container: review-card / inline-size; }
    .card-title { min-width: 0; overflow: hidden; font-size: 16px; line-height: 20px; }
    .card-title strong { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .card-title small { display: block; overflow: hidden; color: #52676e; font-size: 12px; line-height: 16px; text-overflow: ellipsis; white-space: nowrap; }
    @container review-card (min-width: 300px) { .card-title { font-size: 18px; line-height: 22px; } }
    .byline { min-width: 0; margin-top: 8px; overflow: hidden; color: #52717a; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .tag-list { position: relative; display: flex; flex-wrap: wrap; align-content: start; gap: 4px 6px; min-width: 0; min-height: 0; margin-top: 8px; overflow: hidden; }
    .tag, .tag-overflow { display: inline-flex; align-items: center; flex: 0 0 auto; gap: 4px; min-width: 0; max-width: min(150px, 100%); height: 24px; padding: 0 8px; overflow: hidden; color: #566b71; font-size: 12px; white-space: nowrap; background: #f3f7f6; border-radius: 999px; }
    .tag-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .tag-namespace, .tag-favorite { flex: 0 0 auto; font-size: 11px; font-weight: 700; }
    .tag.female .tag-namespace { color: #cb2b68; }
    .tag.male .tag-namespace { color: #1674bc; }
    .tag.favorite { color: #76501e; background: #fff7eb; box-shadow: inset 0 0 0 1px #edb36f; }
    .tag-favorite { color: #e47d17; }
    .tag-overflow { font-variant-numeric: tabular-nums; font-weight: 600; background: #eef4f2; }
    .tag-overflow-measure { position: absolute; visibility: hidden; pointer-events: none; }
    .tag[hidden],
    .tag-overflow[hidden] { display: none; }
    .case-label { display: block; margin-top: 4px; color: #819197; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .meta { display: flex; justify-content: end; gap: 5px; padding-top: 8px; color: #64767d; font-size: 12px; }
    .meta span + span::before { margin-right: 5px; color: #a2b0b2; content: "·"; }
    @media (max-width: 1180px) { .gallery-grid { grid-template-columns: repeat(min(var(--columns), 3), minmax(0, 1fr)); } }
    @media (max-width: 780px) { .gallery-grid { grid-template-columns: repeat(min(var(--columns), 2), minmax(0, 1fr)); } }
    @media (max-width: 560px) { .gallery-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>GalleryCard bounded layout review</h1><p>Cover owns card height; measured tags use +N, while F/M and favorite stars remain separate.</p></div>
    <div class="controls" aria-label="Preview controls">
      <label for="preview">Preview</label><select id="preview"><option>160</option><option selected>220</option><option>280</option><option>360</option></select>
      <span aria-hidden="true">px</span>
      <button type="button" data-columns="1" aria-pressed="false">1</button><button type="button" data-columns="2" aria-pressed="false">2</button><button type="button" data-columns="3" aria-pressed="false">3</button><button type="button" data-columns="4" aria-pressed="true">4</button>
    </div>
  </header>
  <main id="gallery-grid" class="gallery-grid" style="--columns:4; --preview:220px" aria-label="GalleryCard examples"></main>
  <script>
    const galleries = [
      { label: "3 tags · author only", title: "Archive of Rain | 비 내리는 도시의 기록", artist: "serein", pages: 64, id: "#4051038", language: "kr", tags: ["female:glasses", "male:suit", "mystery"], favoriteTags: ["female:glasses", "male:suit"] },
      { label: "10 tags · author + group", title: "Summer Pool Notes | 수영부 기록", subtitle: "여름 수영부 노트", artist: "mizuno", group: "blue hour", pages: 84, id: "#4051027", language: "jp", tags: ["female:swimsuit", "male:swimsuit", "female:short hair", "school", "full color", "sports", "pool", "summer", "long hair", "short hair"], favoriteTags: ["female:swimsuit", "male:swimsuit"] },
      { label: "25+ tags · long chip", title: "A deliberately long canonical title demonstrates tooltip and bounded two-line display | Longer secondary text | English translation", subtitle: "명시된 번역 자막", artist: "paperlane", group: "night studio", pages: 42, id: "#4050974", language: "cn", tags: ["female:schoolgirl uniform", "male:uniform", "an extraordinarily long tag label that measures", "library", "mystery", "night", "full color", "rain", "outdoors", "glasses", "long hair", "short hair", "school", "制服", "adult", "story", "monochrome", "solo", "group", "sports", "summer", "winter", "festival", "city", "translation", "bonus"], favoriteTags: ["female:schoolgirl uniform", "male:uniform"] },
      { label: "favorite F/M/neutral + downloading", title: "Platform 19", artist: "railbird", pages: 55, id: "#4050932", language: "us", tags: ["male:uniform", "female:short hair", "science fiction", "train"], favoriteTags: ["male:uniform", "female:short hair", "science fiction"], status: "downloading" },
      { label: "duplicate review · CN", title: "Twin Copies | 중복 검토", subtitle: "검토 화면으로 이동", artist: "archivebot", group: "imports", pages: 20, id: "#4050901", language: "cn", tags: ["female:glasses", "male:suit", "duplicate", "full color"], favoriteTags: ["female:glasses"], status: "duplicate" },
    ];
    const tagParts = (tag) => { const [namespace, ...rest] = tag.split(":"); return { namespace: rest.length ? namespace : "", label: (rest.length ? rest.join(":") : tag).replaceAll("_", " ") }; };
    const titleParts = (title, subtitle) => {
      const [primary, ...piped] = title.split("|");
      const safePrimary = primary.trim();
      const parts = [...piped.flatMap((part) => part.split("|")), subtitle || ""].map((part) => part.trim()).filter(Boolean);
      return { primary: safePrimary, secondary: [...new Set(parts.filter((part) => part !== safePrimary))].join(" · ") };
    };
    const flag = (language) => language === "cn" ? "../src/assets/flags/cn.svg" : language === "kr" ? "../src/assets/flags/classic-runtime/kr.png" : language === "us" ? "../src/assets/flags/classic-runtime/us.png" : "../src/assets/flags/classic-runtime/jp.png";
    const languageLabel = (language) => ({ cn: "중국어", kr: "한국어", us: "영어", jp: "일본어" }[language]);
    const sortedTags = (gallery) => gallery.tags
      .map((tag, index) => { const parts = tagParts(tag); return { tag, index, parts, favorite: gallery.favoriteTags?.includes(tag) }; })
      .sort((left, right) => Number(right.favorite) - Number(left.favorite)
        || ({ female: 0, male: 1 }[left.parts.namespace] ?? 2) - ({ female: 0, male: 1 }[right.parts.namespace] ?? 2)
        || left.index - right.index);
    const chipsFit = (chips, width, height, gapX, gapY) => {
      let rowWidth = 0, rowHeight = 0, usedHeight = 0;
      for (const chip of chips) {
        const rect = chip.getBoundingClientRect();
        const itemWidth = Math.min(width, rect.width);
        const nextRow = rowWidth > 0 && rowWidth + gapX + itemWidth > width;
        if (nextRow) { usedHeight += rowHeight + gapY; rowWidth = 0; rowHeight = 0; }
        if (usedHeight + rect.height > height) return false;
        rowWidth = rowWidth ? rowWidth + gapX + itemWidth : itemWidth;
        rowHeight = Math.max(rowHeight, rect.height);
      }
      return true;
    };
    const fitTagChips = (tagList) => {
      const tags = [...tagList.querySelectorAll(".tag")];
      const overflow = tagList.querySelector(".tag-overflow-value");
      const overflowMeasures = [...tagList.querySelectorAll(".tag-overflow-measure")];
      const style = getComputedStyle(tagList);
      const gapX = parseFloat(style.columnGap) || 0;
      const gapY = parseFloat(style.rowGap) || 0;
      if (!tagList.clientWidth || !tagList.clientHeight) return;
      tags.forEach((tag) => { tag.hidden = false; });
      overflow.hidden = true;
      if (chipsFit(tags, tagList.clientWidth, tagList.clientHeight, gapX, gapY)) return;
      for (let visible = tags.length - 1; visible >= 0; visible -= 1) {
        const hidden = tags.length - visible;
        const measure = overflowMeasures[String(hidden).length - 1];
        if (!measure || !chipsFit([...tags.slice(0, visible), measure], tagList.clientWidth, tagList.clientHeight, gapX, gapY)) continue;
        tags.slice(visible).forEach((tag) => { tag.hidden = true; });
        overflow.hidden = false;
        overflow.textContent = "+" + hidden;
        overflow.setAttribute("aria-label", "추가 태그 " + hidden + "개");
        overflow.title = tags.slice(visible).map((tag) => tag.dataset.value).join(", ");
        return;
      }
      tags.forEach((tag) => { tag.hidden = true; });
    };
    const grid = document.querySelector("#gallery-grid");
    const render = () => {
      const preview = document.querySelector("#preview").value;
      grid.style.setProperty("--preview", `${preview}px`);
      grid.innerHTML = galleries.map((gallery) => {
        const title = titleParts(gallery.title, gallery.subtitle);
        const status = gallery.status ? `<span class="status-pill ${gallery.status === "duplicate" ? "duplicate" : ""}">${gallery.status === "duplicate" ? "중복 후보" : "다운로드 중"}</span>` : "";
        const group = gallery.group ? ` <span aria-label="그룹">· ${gallery.group}</span>` : "";
        const ordered = sortedTags(gallery);
        const tags = ordered.map(({ tag, parts, favorite }) => {
          const marker = parts.namespace === "female" ? '<span class="tag-namespace" aria-hidden="true">F</span>' : parts.namespace === "male" ? '<span class="tag-namespace" aria-hidden="true">M</span>' : "";
          const star = favorite ? '<span class="tag-favorite" aria-hidden="true">★</span>' : "";
          return `<span class="tag ${parts.namespace}${favorite ? " favorite" : ""}" data-value="${tag}">${marker}<span class="tag-label">${parts.label}</span>${star}</span>`;
        }).join("");
        const overflowMeasures = ["+8", "+88", "+888"].map((value) => `<span class="tag-overflow tag-overflow-measure" aria-hidden="true">${value}</span>`).join("");
        return `<article class="gallery-card" aria-label="${gallery.title}" title="${gallery.title}"><div class="cover">${status}<span class="language-flag"><img src="${flag(gallery.language)}" alt="${languageLabel(gallery.language)}"></span></div><div class="card-content"><div class="card-title" title="${gallery.title}"><strong>${title.primary}</strong>${title.secondary ? `<small>${title.secondary}</small>` : ""}<span class="case-label">${gallery.label}</span></div><div class="byline">${gallery.artist}${group}</div><div class="tag-list" aria-label="태그: ${gallery.tags.join(", ")}">${tags}<span class="tag-overflow tag-overflow-value" role="note" hidden></span>${overflowMeasures}</div><div class="meta"><span>${gallery.pages}p</span><span>${gallery.id}</span></div></div></article>`;
      }).join("");
      grid.querySelectorAll(".tag-list").forEach(fitTagChips);
    };
    document.querySelector("#preview").addEventListener("change", render);
    document.querySelectorAll("[data-columns]").forEach((button) => button.addEventListener("click", () => { grid.style.setProperty("--columns", button.dataset.columns); document.querySelectorAll("[data-columns]").forEach((item) => item.setAttribute("aria-pressed", String(item === button))); requestAnimationFrame(render); }));
    new ResizeObserver(() => grid.querySelectorAll(".tag-list").forEach(fitTagChips)).observe(grid);
    render();
  </script>
</body>
</html>
