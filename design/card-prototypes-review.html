  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #atsumi-poster-grid .atsumi-art-0 { background-position: 0 0; }
    #atsumi-poster-grid .atsumi-art-1 { background-position: 50% 0; }
    #atsumi-poster-grid .atsumi-art-2 { background-position: 100% 0; }
    #atsumi-poster-grid .atsumi-art-3 { background-position: 0 100%; }
    #atsumi-poster-grid .atsumi-art-4 { background-position: 50% 100%; }
    #atsumi-poster-grid .atsumi-art-5 { background-position: 100% 100%; }

    #atsumi-poster-grid .atsumi-status-wash {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    #atsumi-poster-grid .atsumi-poster-card.is-downloading .atsumi-status-wash {
      background: linear-gradient(180deg, transparent 46%, light-dark(rgba(22, 126, 164, 0.13), rgba(74, 164, 193, 0.16)) 100%);
    }

    #atsumi-poster-grid .atsumi-poster-card.has-problem .atsumi-status-wash {
      background:
        radial-gradient(circle at 100% 100%, light-dark(rgba(172, 105, 23, 0.18), rgba(222, 155, 72, 0.20)), transparent 54%),
        linear-gradient(180deg, transparent 60%, light-dark(rgba(172, 105, 23, 0.08), rgba(222, 155, 72, 0.10)) 100%);
    }

    #atsumi-poster-grid .atsumi-poster-card.is-complete .atsumi-status-wash {
      background: linear-gradient(180deg, transparent 50%, light-dark(rgba(52, 123, 97, 0.10), rgba(91, 166, 137, 0.12)) 100%);
    }

    #atsumi-poster-grid .atsumi-progress {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 4;
      display: none;
      height: 3px;
      overflow: hidden;
      background: light-dark(rgba(255, 255, 255, 0.40), rgba(0, 0, 0, 0.28));
    }

    #atsumi-poster-grid .atsumi-poster-card.is-downloading .atsumi-progress {
      display: block;
    }

    #atsumi-poster-grid .atsumi-progress::after {
      display: block;
      width: 41%;
      height: 100%;
      content: &quot;&quot;;
      background: light-dark(rgba(22, 126, 164, 0.74), rgba(91, 179, 207, 0.78));
    }

    #atsumi-poster-grid .atsumi-language {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 5;
      display: grid;
      place-items: center;
      width: 30px;
      height: 22px;
      padding: 3px;
      background: light-dark(rgba(255, 255, 255, 0.88), rgba(24, 35, 40, 0.84));
      border-radius: 6px;
      backdrop-filter: blur(6px);
    }

    #atsumi-poster-grid .atsumi-language img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #atsumi-poster-grid .atsumi-status-caption {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 5;
      max-width: calc(100% - 58px);
      padding: 6px 8px;
      overflow: hidden;
      color: light-dark(#31494f, #e7f0ef);
      text-overflow: ellipsis;
      white-space: nowrap;
      background: light-dark(rgba(255, 255, 255, 0.82), rgba(23, 34, 39, 0.80));
      border-radius: 7px;
      opacity: 0;
      backdrop-filter: blur(7px);
      transform: translateY(3px);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    #atsumi-poster-grid .atsumi-poster-card:hover .atsumi-status-caption {
      opacity: 1;
      transform: translateY(0);
    }

    #atsumi-poster-grid .atsumi-poster-copy {
      display: grid;
      grid-template-rows: minmax(48px, auto) 24px minmax(52px, auto) 20px;
      gap: 8px;
      padding: 13px 13px 12px;
    }

    #atsumi-poster-grid .atsumi-card-title {
      display: grid;
      align-content: start;
      gap: 2px;
      min-width: 0;
    }

    #atsumi-poster-grid .atsumi-card-title strong {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    #atsumi-poster-grid .atsumi-card-title small {
      overflow: hidden;
      color: light-dark(#52676e, #a9bbbd);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #atsumi-poster-grid .atsumi-byline {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      overflow: hidden;
      color: light-dark(#52717a, #9eb9bf);
      white-space: nowrap;
    }

    #atsumi-poster-grid .atsumi-byline svg {
      flex: 0 0 auto;
    }

    #atsumi-poster-grid .atsumi-byline span:not(.atsumi-byline-separator) {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #atsumi-poster-grid .atsumi-byline-separator {
      flex: 0 0 auto;
      color: light-dark(#a2b0b2, #71878b);
    }

    #atsumi-poster-grid .atsumi-tag-list {
      display: flex;
      flex-wrap: wrap;
      align-content: start;
      gap: 5px;
      min-width: 0;
      overflow: hidden;
    }

    #atsumi-poster-grid .atsumi-tag {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      max-width: 100%;
      height: 24px;
      padding: 0 8px;
      overflow: hidden;
      color: light-dark(#566b71, #b4c4c6);
      text-overflow: ellipsis;
      white-space: nowrap;
      background: light-dark(#f3f7f6, #2a3940);
      border-radius: 999px;
    }

    #atsumi-poster-grid .atsumi-tag b {
      margin-right: 5px;
      color: light-dark(#a33568, #e595b5);
      font-weight: 500;
    }

    #atsumi-poster-grid .atsumi-tag b.is-male {
      color: light-dark(#2173aa, #82bce4);
    }

    #atsumi-poster-grid .atsumi-card-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      color: light-dark(#667a80, #9dafb2);
    }

    #atsumi-poster-grid .atsumi-meta-separator {
      color: light-dark(#a2b0b2, #71878b);
    }

    @media (max-width: 920px) {
      #atsumi-poster-grid[data-columns=&quot;4&quot;] .atsumi-gallery,
      #atsumi-poster-grid[data-columns=&quot;5&quot;] .atsumi-gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      #atsumi-poster-grid .atsumi-gallery,
      #atsumi-poster-grid[data-columns=&quot;3&quot;] .atsumi-gallery,
      #atsumi-poster-grid[data-columns=&quot;4&quot;] .atsumi-gallery,
      #atsumi-poster-grid[data-columns=&quot;5&quot;] .atsumi-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #atsumi-poster-grid .atsumi-grid-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 390px) {
      #atsumi-poster-grid .atsumi-gallery,
      #atsumi-poster-grid[data-columns=&quot;3&quot;] .atsumi-gallery,
      #atsumi-poster-grid[data-columns=&quot;4&quot;] .atsumi-gallery,
      #atsumi-poster-grid[data-columns=&quot;5&quot;] .atsumi-gallery {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #atsumi-poster-grid .atsumi-poster-card,
      #atsumi-poster-grid .atsumi-status-caption {
        transition: none;
      }
    }
  &lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;

  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {

    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();

    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();

    const request = ++positionRequest;

        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

              &quot;--tooltip-available-width&quot;,

            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0

    if (delay === 0) {
      openTooltip(trigger);
      return;
    }

    }

    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

    const trigger = getTrigger(event.target);

    closeTooltip(false);

    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
